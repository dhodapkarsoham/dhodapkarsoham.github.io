<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/mark.svg' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  <meta name="color-scheme" content="light dark">
  <script src="{{ '/assets/js/appearance.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <link rel="stylesheet" href="{{ '/assets/css/notebook.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script defer src="{{ '/assets/js/notebook.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  {% include gtm_head.html %}
</head>
<body>
{% include gtm_body.html %}
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header wrap">
  <a class="identity" href="{{ '/' | relative_url }}">Soham Dhodapkar</a>
  <nav aria-label="Main navigation">
    <a href="{{ '/' | relative_url }}#writing" {% if page.layout == 'home' %}aria-current="page"{% endif %}>Writing</a>
    <a href="{{ '/aboutme' | relative_url }}" {% if page.url contains 'aboutme' %}aria-current="page"{% endif %}>About</a>
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  </nav>
  <div class="appearance" hidden><label for="appearance-select">Appearance</label><select id="appearance-select"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
</header>
<main id="main">{{ content }}</main>
<footer class="site-footer wrap">
  <div><a class="footer-name" href="{{ '/aboutme' | relative_url }}">Soham Dhodapkar</a><p>Graphs, data, AI, and personal notes.</p></div>
  <nav aria-label="Social links"><a href="https://github.com/{{ site.social-network-links.github }}">GitHub</a><a href="https://www.linkedin.com/in/{{ site.social-network-links.linkedin }}/">LinkedIn</a><a href="{{ '/feed.xml' | relative_url }}">RSS</a></nav>
</footer>
</body>
</html>
