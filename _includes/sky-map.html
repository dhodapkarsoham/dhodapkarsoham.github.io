{% assign sky_v = site.time | date: '%s' %}
<link rel="stylesheet" href="{{ '/assets/sky-graph/sky-map.css' | relative_url }}?v={{ sky_v }}">
<figure class="sky-graph" data-sky-graph data-src="{{ '/assets/sky-graph/sky-graph.json' | relative_url }}?v={{ sky_v }}">
  <div class="sky-canvas">
    <canvas role="img" aria-label="Map of the whole sky: naked-eye stars, constellation stick figures and exoplanet host stars. Query results are listed in text below the map."></canvas>
    <div class="sky-tooltip" hidden></div>
  </div>
  <div class="sky-controls">
    <label><input type="checkbox" data-toggle="lines" checked> Constellation lines</label>
    <label><input type="checkbox" data-toggle="hosts" checked> <span class="sky-swatch sky-swatch-host" aria-hidden="true"></span>Planet hosts</label>
    <p class="sky-status" role="status">The map loads when you scroll here.</p>
  </div>

  <div class="sky-tabs" role="tablist" aria-label="Graph queries">
    <button type="button" role="tab" id="sky-tab-route" aria-controls="sky-panel-route" aria-selected="true" data-query="route" disabled>Route to TRAPPIST-1</button>
    <button type="button" role="tab" id="sky-tab-earthlike" aria-controls="sky-panel-earthlike" aria-selected="false" tabindex="-1" data-query="earthlike" disabled>Earth-like planets</button>
    <button type="button" role="tab" id="sky-tab-counts" aria-controls="sky-panel-counts" aria-selected="false" tabindex="-1" data-query="counts" disabled>Planet counts</button>
  </div>

  <section class="sky-panel" role="tabpanel" id="sky-panel-route" aria-labelledby="sky-tab-route">
    <label class="sky-slider">Longest single jump
      <input type="range" min="6" max="10" step="0.5" value="6" data-input="max">
      <output data-output="max">6.0</output> ly
    </label>
    <div data-result="route" aria-live="polite"></div>
    <details><summary>Cypher</summary><pre><code data-cypher="route"></code></pre></details>
  </section>
  <section class="sky-panel" role="tabpanel" id="sky-panel-earthlike" aria-labelledby="sky-tab-earthlike" hidden>
    <div data-result="earthlike" aria-live="polite"></div>
    <details><summary>Cypher</summary><pre><code data-cypher="earthlike"></code></pre></details>
  </section>
  <section class="sky-panel" role="tabpanel" id="sky-panel-counts" aria-labelledby="sky-tab-counts" hidden>
    <div data-result="counts" aria-live="polite"></div>
    <details><summary>Cypher</summary><pre><code data-cypher="byConstellation"></code></pre><pre><code data-cypher="byMethodDecade"></code></pre></details>
  </section>

  <figcaption>Every naked-eye star and every known exoplanet host, with the queries running live in your browser on <a href="https://relatedb.ai">Relate</a> compiled to WebAssembly (about 3 MB to download).</figcaption>
  <noscript><p>The interactive sky map needs JavaScript.</p></noscript>
</figure>
<script type="module" src="{{ '/assets/sky-graph/sky-map.js' | relative_url }}?v={{ sky_v }}"></script>
